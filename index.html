<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You, Dida 🌸</title>
<meta name="description" content="A special interactive surprise just for Dida">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== ROOT & RESET ===== */
:root {
  --pink: #ffd6e8;
  --lavender: #e3ccff;
  --mint: #c6f5df;
  --sky: #c6e6ff;
  --sun: #fff3b0;
  --accent: #ff6fa5;
  --accent-deep: #e8407f;
  --plum: #5b3a5b;
  --cream: #fffaf3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Quicksand', sans-serif;
  color: var(--plum);
  overflow: hidden;
  height: 100vh;
  background: var(--cream);
}
h1,h2,h3 { font-family: 'Fredoka', sans-serif; }

/* ===== BUTTONS ===== */
.btn {
  font-family: 'Fredoka', sans-serif;
  background: var(--accent); color: white;
  border: none; border-radius: 40px;
  padding: 16px 36px; font-size: 1.15rem;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--accent-deep);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  position: relative;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--accent-deep); }
.btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--accent-deep); }

/* ===== PAGE 1: GREETING ===== */
#page-greeting {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffe0f0 0%, #ffd6e8 30%, #e3ccff 60%, #c6e6ff 100%);
}

/* Floating particles */
.particle {
  position: absolute; pointer-events: none;
  animation: floatUp linear infinite;
  opacity: 0.6;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* Greeting Hero */
.greeting-hero {
  text-align: center;
  margin-bottom: 20px;
}
.greeting-emoji-bounce {
  font-size: 5.5rem;
  display: inline-block;
  animation: floatBounce 2.5s ease-in-out infinite;
  filter: drop-shadow(0 6px 12px rgba(255,111,165,0.3));
}
@keyframes floatBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-16px) scale(1.08) rotate(4deg); }
}
.greeting-hero h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  color: var(--accent-deep);
  text-shadow: 3px 3px 0 white, 0 8px 20px rgba(232,64,127,0.25);
  margin-top: 10px;
  font-family: 'Fredoka', sans-serif;
}

.greeting-btn {
  animation: btnPulse 2s infinite;
  margin-top: 30px;
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 6px 0 var(--accent-deep), 0 0 0 0 rgba(255,111,165,0.4); }
  50% { box-shadow: 0 6px 0 var(--accent-deep), 0 0 0 20px rgba(255,111,165,0); }
}

.greeting-subtitle {
  font-size: 1.1rem;
  color: var(--plum);
  opacity: 0.8;
  margin-top: 8px;
  animation: fadeIn 1.2s ease 0.8s both;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:0.8; transform:translateY(0); } }
</style>
</head>
<body>

<div id="page-greeting">
  <div id="greeting-particles"></div>

  <div class="greeting-hero">
    <div class="greeting-emoji-bounce">🌸</div>
    <h1>HIII Dida ! ✨</h1>
  </div>

  <p class="greeting-subtitle">I made something special for you ✨</p>
  <button class="btn greeting-btn" onclick="window.location.href='games.html'">Come In! 💕</button>
</div>

<script>
/* ===== GREETING PARTICLES ===== */
(function initParticles() {
  const container = document.getElementById('greeting-particles');
  const emojis = ['🌸', '✨', '💕', '🌷', '⭐', '🦋', '💖', '🌺'];
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
    container.appendChild(p);
  }
})();
</script>

</body>
</html>
